name: build and release

# Linux binaries are built once per arch in the pinned build container; the
# Docker image and the release tarballs both use those exact files.
# Push a tag `v*` to publish a GitHub release and versioned image tags.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/lk-latency

jobs:
  linux:
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: scripts/build-linux.sh ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: dist/linux-${{ matrix.arch }}

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: brew install pkg-config jpeg-turbo
      - run: curl -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain none && echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - run: scripts/build-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: dist/macos-arm64

  image:
    needs: linux
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - run: chmod +x dist/*/lk-latency
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: "${{ github.actor }}"
          password: "${{ secrets.GITHUB_TOKEN }}"
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha
      # The image stage only copies dist/linux-<arch>/lk-latency; nothing is recompiled.
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: image
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}

  release:
    needs: [linux, macos, image]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - run: chmod +x dist/*/lk-latency && scripts/package.sh "${GITHUB_REF_NAME}"
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/SHA256SUMS --generate-notes
